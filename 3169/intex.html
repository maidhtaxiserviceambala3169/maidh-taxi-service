
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maidh Taxi Service | Ambala</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7ff;
      color: #17264a;
    }
    header {
      background: #102d70;
      color: white;
      padding: 30px 18px;
      text-align: center;
    }
    main {
      max-width: 600px;
      margin: 25px auto;
      padding: 20px;
    }
    .panel {
      background: white;
      padding: 22px;
      border-radius: 14px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #ccd4e5; }
    button {
      background: #c49a36;
      color: white;
      border: 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>MAIDH TAXI SERVICE</h1>
    <p>Ambala | Local • Outstation • Airport Taxi</p>
  </header>
  <main>
    <div class="panel">
      <h2>Book Your Taxi</h2>
      <form>
        <input placeholder="Customer Name" required>
        <input type="tel" placeholder="Mobile Number" required>
        <input placeholder="Pickup Location" required>
        <input placeholder="Destination" required>
        <input type="date" required>
        <button type="submit">Confirm Taxi Booking</button>
<p id="bookingMessage" role="status"></p>
      <form id="bookingForm">
      <p>WhatsApp: 9467670607</p>
    </div>
  </main>
</body>
</html>
