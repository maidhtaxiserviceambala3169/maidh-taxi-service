
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maidh Taxi Service | Ambala</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7ff;
      color: #17264a;
    }
    header {
      background: #102d70;
      color: white;
      padding: 30px 18px;
      text-align: center;
    }
    main {
      max-width: 600px;
      margin: 25px auto;
      padding: 20px;
    }
    .panel {
      background: white;
      padding: 22px;
      border-radius: 14px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #ccd4e5; }
    button {
      background: #c49a36;
      color: white;
      border: 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>MAIDH TAXI SERVICE</h1>
    <p>Ambala | Local • Outstation • Airport Taxi</p>
  </header>
  <main>
    <div class="panel">
      <h2>Book Your Taxi</h2>
      <form>
        <input placeholder="Customer Name" required>
        <input type="tel" placeholder="Mobile Number" required>
        <input placeholder="Pickup Location" required>
        <input placeholder="Destination" required>
        <input type="date" required>
        <button type="submit">Confirm Taxi Booking</button>
<p id="bookingMessage" role="status"></p>
      <form id="bookingForm">
      <p>WhatsApp: 9467670607</p>
    </div>
  </main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBVGUUhf6-stBTlUBVcSlHsSPaYqLk5gcI",
  authDomain: "maidh-taxi-service.firebaseapp.com",
  projectId: "maidh-taxi-service",
  storageBucket: "maidh-taxi-service.firebasestorage.app",
  messagingSenderId: "346666820512",
  appId: "1:346666820512:web:071b4b3d5fe30fdad9bac5",
  measurementId: "G-8B8SM3K1VP"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("bookingForm");
const message = document.getElementById("bookingMessage");
const submitButton = form?.querySelector('button[type="submit"]');

form?.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!form.reportValidity()) return;

  const inputs = form.querySelectorAll("input");
  const [name, mobile, pickup, destination, date] =
    Array.from(inputs).map(input => input.value.trim());

  if (!name || !mobile || !pickup || !destination || !date) {
    message.textContent = "Please complete all booking fields.";
    return;
  }

  submitButton.disabled = true;
  message.textContent = "Sending your booking...";

  try {
    await addDoc(collection(db, "bookings"), {
      customerName: name,
      mobile: mobile,
      pickup: pickup,
      destination: destination,
      travelDate: date,
      status: "pending",
      createdAt: serverTimestamp()
    });

    message.textContent =
      "Booking received! Our team will contact you soon.";
    form.reset();

  } catch (error) {
    console.error("Booking submission failed:", error);
    message.textContent =
      "Booking could not be confirmed. Please contact us on WhatsApp: 9467670607.";
  } finally {
    submitButton.disabled = false;
  }
});
      </script>
      </body>
</html>
